name: "Travelista Daily Automated Editorial (21:15 WIB H-1 untuk Tayang 09:00 WIB - 4 Artikel Harian Bulan ke-1)"

on:
  schedule:
    # 14:15 UTC = 21:15 WIB (Setiap Malam H-1 secara Otomatis di Cloud)
    # Menghindari antrean padat jam bulat (:00).
    # Naskah selesai malam hari agar 100% siap tayang di meja redaksi pukul 09:00 WIB hari H.
    - cron: '15 14 * * *'
  workflow_dispatch:
    inputs:
      preferred_genre:
        description: 'Opsional: Pilih 1 Genre spesifik (kosongkan untuk otomatis membuat 4 artikel semua genre)'
        required: false
        default: ''
      auto_send:
        description: 'Kirim ke CMS Travelista? (Mode 1 Sandbox default: false)'
        required: false
        default: 'false'

jobs:
  generate-daily-articles:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Run Autonomous Daily Editorial Pipeline (Bank Naskah H-1: 21:15 WIB - 4 Artikel / Hari)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRAVELISTA_CMS_URL: ${{ secrets.TRAVELISTA_CMS_URL }}
          TRAVELISTA_CMS_API_KEY: ${{ secrets.TRAVELISTA_CMS_API_KEY }}
          AUTO_SEND_TO_CMS: 'false'
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.preferred_genre }}" ]; then
            ARGS="$ARGS --genre \"${{ github.event.inputs.preferred_genre }}\""
          fi
          if [ "${{ github.event.inputs.auto_send }}" != "true" ]; then
            ARGS="$ARGS --no-send"
          fi
          python run_daily_job.py $ARGS
